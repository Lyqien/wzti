</style></head><body><header><a href="#" id="brand" aria-label="返回首页"><img data-brand-logo="" alt="WZTI"></a><span>王者荣耀人格测试</span></header><main id="app" aria-live="polite"></main><footer>这是一次娱乐性的角色相似度测试，<br class="mobile">你的性格也拥有更多可能。</footer><script>globalThis.WZTI_CONFIG={"version":"WZTI-entertainment-v8-28-images-logo-icon","questions":[{"id":"Q01","block":0,"weight":2,"question":"一段经历结束后，什么最让你觉得值得？","options":{"A":"有人因为我而过得更好。","B":"做了真正由自己决定的事。","C":"完成了难事，看到了自己的进步。","D":"明白了一些以前没想通的东西。"},"optionKeys":{"A":"A","B":"B","C":"C","D":"D"}},{"id":"Q02","block":1,"weight":2,"question":"接到一个不熟悉的任务，你通常先？","options":{"A":"先动手试一次，边做边发现问题。","B":"找个更省力或更灵活的切入点。","C":"观察情况，弄懂它为什么会这样。","D":"列出步骤，弄清怎样才算完成。"},"optionKeys":{"A":"B","B":"C","C":"D","D":"A"}},{"id":"Q03","block":2,"weight":2,"question":"在一群熟悉的人里，你最自然的位置是？","options":{"A":"保留自己的空间，有需要再参与。","B":"帮大家确定安排，把事情组织起来。","C":"主动聊天，让彼此更亲近。","D":"不一定多说，但会照顾具体需要。"},"optionKeys":{"A":"C","B":"D","C":"A","D":"B"}},{"id":"Q04","block":4,"weight":2,"question":"别人的安排碰到了你的底线，你通常会？","options":{"A":"想清对方的目的，找合适时机回应。","B":"当面说明，我不能接受。","C":"先拉开距离，避免继续冲突。","D":"解释自己的想法，尝试达成共识。"},"optionKeys":{"A":"D","B":"A","C":"B","D":"C"}},{"id":"Q05","block":5,"weight":2,"question":"一件事没有人催、也没有奖励时，什么最能让你继续投入？","options":{"A":"它能让我发现规律，或做出新的东西。","B":"它能解决生活中真实存在的问题。","C":"它本身很美，或让我产生特别的感受。","D":"它能让我和重要的人有更多共同经历。"},"optionKeys":{"A":"A","B":"B","C":"C","D":"D"}},{"id":"Q06","block":6,"weight":2,"question":"从一次失败中缓过来后，你更想先？","options":{"A":"再试一次，我不想停在这里。","B":"换一种办法，也许原路并不合适。","C":"和信任的人聊聊，重新找回力量。","D":"找出原因，想清下次怎样改进。"},"optionKeys":{"A":"B","B":"C","C":"D","D":"A"}},{"id":"Q07","block":3,"weight":1,"question":"压力很大时，你最容易出现哪种反应？","options":{"A":"想把事情都抓在手里才安心。","B":"想躲进熟悉的人或舒服的环境里。","C":"把事情压在心里，尽量自己扛。","D":"说话变冲，对质疑特别敏感。"},"optionKeys":{"A":"C","B":"D","C":"A","D":"B"}},{"id":"Q08","block":0,"weight":2,"question":"如果有一个月可以自由安排，你更想？","options":{"A":"陪重要的人完成一个愿望。","B":"离开熟悉的节奏，过一阵随心的生活。","C":"挑战一个能留下成果的目标。","D":"钻研一个一直吸引自己的问题。"},"optionKeys":{"A":"A","B":"B","C":"C","D":"D"}},{"id":"Q09","block":1,"weight":2,"question":"计划突然被打乱，你更接近哪种反应？","options":{"A":"先解决眼前最紧迫的事。","B":"看看能不能顺势换一条路。","C":"先弄清变化的原因，再决定。","D":"重新排好顺序，尽快恢复节奏。"},"optionKeys":{"A":"B","B":"C","C":"D","D":"A"}},{"id":"Q10","block":2,"weight":2,"question":"发现朋友情绪低落，你通常更愿意？","options":{"A":"告诉他我在，但让他决定要不要聊。","B":"和他一起理清问题，确定接下来怎么办。","C":"找他聊聊，陪他把感受说出来。","D":"帮他做点实际的事，等他愿意开口。"},"optionKeys":{"A":"C","B":"D","C":"A","D":"B"}},{"id":"Q11","block":4,"weight":2,"question":"面对一条你认为不合理的规定，你更可能？","options":{"A":"了解制定原因，找到改变它的切入点。","B":"直接提出反对，并说明理由。","C":"尽量避开它，保留自己的空间。","D":"与相关的人商量，争取调整。"},"optionKeys":{"A":"D","B":"A","C":"B","D":"C"}},{"id":"Q12","block":5,"weight":2,"question":"去一个陌生的地方，你最容易被什么吸引？","options":{"A":"新奇的设计，或没见过的知识。","B":"当地人怎样生活，事情怎样运转。","C":"风景、音乐，以及那里独有的氛围。","D":"遇见的人，以及一起留下的故事。"},"optionKeys":{"A":"A","B":"B","C":"C","D":"D"}},{"id":"Q13","block":6,"weight":2,"question":"一个长期目标卡住了，你更接近哪种做法？","options":{"A":"继续练习，先把最难的一步顶过去。","B":"重新考虑目标或路线，允许自己调整。","C":"请熟悉我的人陪我一起理清。","D":"回看整个过程，检查哪里出了问题。"},"optionKeys":{"A":"B","B":"C","C":"D","D":"A"}},{"id":"Q14","block":3,"weight":1,"question":"被重要的人误解后，你最容易？","options":{"A":"反复解释，想让对方接受自己的判断。","B":"先缓和关系，哪怕暂时委屈自己。","C":"先沉默，等自己整理好了再说。","D":"马上辩解，有时语气比本意更重。"},"optionKeys":{"A":"C","B":"D","C":"A","D":"B"}},{"id":"Q15","block":0,"weight":2,"question":"朋友问你为什么坚持，你更可能回答？","options":{"A":"因为有我在意的人和承诺。","B":"因为我不想活成别人规定的样子。","C":"因为我想看看自己到底能做到哪一步。","D":"因为这件事背后的答案或意义吸引我。"},"optionKeys":{"A":"A","B":"B","C":"C","D":"D"}},{"id":"Q16","block":1,"weight":2,"question":"一个问题迟迟解决不了，你更常用哪种办法？","options":{"A":"集中精力，再正面尝试一次。","B":"换个角度，试试原来没考虑的方法。","C":"停下来想想，是不是漏掉了什么。","D":"拆成小步骤，逐项处理。"},"optionKeys":{"A":"B","B":"C","C":"D","D":"A"}},{"id":"Q17","block":2,"weight":2,"question":"合作做事时，你最习惯关注？","options":{"A":"自己的职责是否明确，是否有发挥空间。","B":"整体方向是否清楚，分工是否合适。","C":"大家是否愿意交流，彼此相处舒服吗。","D":"有没有人需要我补位或分担。"},"optionKeys":{"A":"C","B":"D","C":"A","D":"B"}},{"id":"Q18","block":4,"weight":2,"question":"合作中有人误解了你的意思，你会先？","options":{"A":"整理事实，选择更有说服力的方式回应。","B":"马上指出哪里理解错了。","C":"等情绪过去，再决定要不要解释。","D":"问清对方怎么想，再表达自己的意思。"},"optionKeys":{"A":"D","B":"A","C":"B","D":"C"}},{"id":"Q19","block":5,"weight":2,"question":"如果要做一份送给自己的纪念，你更想留下？","options":{"A":"自己的想法、作品，或学会的新本领。","B":"真正派得上用场、能长期使用的东西。","C":"能保存某种心情的照片、文字或音乐。","D":"和重要的人有关的信件、礼物或回忆。"},"optionKeys":{"A":"A","B":"B","C":"C","D":"D"}},{"id":"Q20","block":6,"weight":2,"question":"遇到困难时，哪句话最能鼓励你？","options":{"A":"再坚持一下，你还能走得更远。","B":"路不止一条，换个方向也可以。","C":"你不用一个人面对，我会陪着你。","D":"弄清问题，就离答案更近一步。"},"optionKeys":{"A":"B","B":"C","C":"D","D":"A"}},{"id":"Q21","block":3,"weight":1,"question":"连续受挫时，你最需要提醒自己什么？","options":{"A":"有些事不在自己的掌控之中。","B":"先面对眼前的事，别一直躲着。","C":"需要帮助时，可以开口。","D":"先缓一缓，不必急着反击。"},"optionKeys":{"A":"C","B":"D","C":"A","D":"B"}},{"id":"Q22","block":0,"weight":2,"question":"四种评价里，你最希望被这样理解？","options":{"A":"你是一个值得信赖、会照顾人的人。","B":"你很有自己的想法，也敢选择自己的路。","C":"你有实力，能把想做的事做成。","D":"你看得细，也想得深。"},"optionKeys":{"A":"A","B":"B","C":"C","D":"D"}},{"id":"Q23","block":1,"weight":2,"question":"你更喜欢怎样开始一场旅行？","options":{"A":"有个目的地就出发，到了再说。","B":"准备几个选择，途中随时调整。","C":"先了解那里，挑一个真正感兴趣的去处。","D":"先确定路线、时间和重要安排。"},"optionKeys":{"A":"B","B":"C","C":"D","D":"A"}},{"id":"Q24","block":2,"weight":2,"question":"面对重要的人，你更常怎样表达在意？","options":{"A":"尊重对方的选择，也保留彼此的边界。","B":"替双方考虑未来，让共同的事情更有着落。","C":"直接说出来，也主动创造相处的机会。","D":"记住小事，在需要的时候出现。"},"optionKeys":{"A":"C","B":"D","C":"A","D":"B"}},{"id":"Q25","block":4,"weight":2,"question":"你更能接受哪种处理分歧的方式？","options":{"A":"先不急着表态，把前因后果弄清楚。","B":"意见摆出来，即使当时有点不愉快。","C":"各退一步，给彼此留些空间。","D":"多谈一会儿，找到双方能接受的办法。"},"optionKeys":{"A":"D","B":"A","C":"B","D":"C"}},{"id":"Q26","block":5,"weight":2,"question":"别人讲述一段经历时，你最想追问？","options":{"A":"你发现了什么，有没有新的想法？","B":"后来怎么解决，哪些办法最管用？","C":"那个瞬间给你什么感受？","D":"谁陪着你，你们之间发生了什么？"},"optionKeys":{"A":"A","B":"B","C":"C","D":"D"}},{"id":"Q27","block":6,"weight":2,"question":"经历挫折后，你最希望获得什么？","options":{"A":"再次挑战的机会，证明这次不是终点。","B":"重新选择的空间，不必困在原来的路上。","C":"被理解和支持，让自己重新安定下来。","D":"更清楚的判断，知道以后如何避免。"}," function calculateWZTIDimensions(config, answers) {
  const result = {};
  for (const rule of config.dimensionRules) {
    let total = 0, count = 0;
    for (const q of config.questions) {
      const group = rule.groups[String(q.block)];
      if (!group) continue;
      const key = q.optionKeys[answers[q.id]];
      if (!Object.prototype.hasOwnProperty.call(group, key)) throw new Error('Missing dimension answer: ' + q.id);
      total += group[key];
      count++;
    }
    if (!count) throw new Error('Empty dimension: ' + rule.name);
    result[rule.name] = Math.round(total / count);
  }
  return result;
}
function matchWZTI(config, answers = {}) {
  const missing = config.questions.filter(q => !Object.prototype.hasOwnProperty.call(q.options, answers[q.id])).map(q => q.id);
  if (missing.length) return { status: 'incomplete', missing };
  const scored = config.heroes.map((h, index) => {
    const hits = config.questions.map(q => q.optionKeys[answers[q.id]] === h.keys[q.block]);
    const groups = Array(7).fill(0);
    config.questions.forEach((q, i) => { if (hits[i]) groups[q.block] += q.weight; });
    return { hero: h.hero, index, hits, groups, score: groups.reduce((a,b) => a+b, 0) };
  });
  scored.sort((a,b) => {
    if (a.score !== b.score) return b.score-a.score;
    for (const group of config.tieBlockOrder) {
      if (a.groups[group] !== b.groups[group]) return b.groups[group]-a.groups[group];
    }
    for (let i=config.questions.length-1;i>=0;i--) {
      if (a.hits[i] !== b.hits[i]) return Number(b.hits[i])-Number(a.hits[i]);
    }
    return a.index-b.index;
  });
  const result = config.results.find(h => h['英雄名称'] === scored[0].hero);
  if (!result) throw new Error('Missing result: ' + scored[0].hero);
  const displayResult = JSON.parse(JSON.stringify(result));
  // Hero reference values stay in config; the result page shows this user's answers.
  displayResult['性格维度百分比'] = calculateWZTIDimensions(config, answers);
  return { status: 'matched', result: displayResult };
}

function show(html){clearTimeout(transitionTimer);document.body.classList.toggle("answering",screen==="question");document.documentElement.classList.toggle("answering",screen==="question");app.innerHTML=html;window.scrollTo({top:0,behavior:'instant'});const heading=app.querySelector('h1');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true})}}
function home(){screen='home', transitionTimer;show(`<section class="home"><img class="home-logo home-icon" src="${config.brand.iconDataURI}" alt="WZTI"><div class="eyebrow">王者荣耀人格测试</div><h1>来测测你的农格</h1><p class="completion-time">约5-8分钟完成</p><button class="primary" id="start">开始测试</button></section>`);document.querySelector('#start').onclick=()=>{answers={};current=0;question()}}
function question(){screen='question';const q=config.questions[current];show(`<section class="question"><div class="meta"><span>答题进度</span><span><strong>${String(current+1).padStart(2,'0')}</strong> / 28</span></div><div class="progress" role="progressbar" aria-label="已完成题目" aria-valuemin="0" aria-valuemax="28" aria-valuenow="${Object.keys(answers).length}"><i style="width:${Object.keys(answers).length/28*100}%"></i></div><h1>${esc(q.question)}</h1><div class="options" role="group" aria-label="请选择一个答案">${Object.entries(q.options).map(([key,value])=>`<button class="option ${answers[q.id]===key?'selected':''}" aria-pressed="${answers[q.id]===key}" data-key="${key}"><b>${key}</b><span>${esc(value)}</span></button>`).join('')}</div><div class="nav"><button class="secondary" id="prev" ${current===0?'disabled':''}>← 上一题</button></div></section>`);app.querySelectorAll('.option').forEach(btn=>btn.onclick=()=>{if(btn.disabled)return;answers[q.id]=btn.dataset.key;app.querySelectorAll('.option').forEach(el=>{el.disabled=true;el.classList.toggle('selected',el===btn);el.setAttribute('aria-pressed',el===btn)});transitionTimer=setTimeout(()=>{if(current<27){current++;question()}else result()},220)});document.querySelector('#prev').onclick=()=>{if(current>0){current--;question()}}}


function heroImage(record,kind){const path=record['英雄展示图'],name=record['英雄名称'];const preview=config.imagePreviews?.[path]||asset(path);return `<div class="art-frame ${kind==='hero'?'main':'partner'}-art-frame" aria-busy="true"><img class="${kind}-art" src="${esc(preview)}" data-original="${esc(path)}" alt="${esc(name)}"><div class="image-status" role="status"><span>正在加载清晰图…</span><button type="button" hidden>重新加载</button></div></div>`}
function requestImage(url){return new Promise((resolve,reject)=>{const image=new Image();let finished=false;const finish=(error)=>{if(finished)return;finished=true;clearTimeout(timer);image.onload=image.onerror=null;if(error){image.src='';reject(error)}else resolve(image)};const timer=setTimeout(()=>finish(new Error('timeout')),7000);image.onload=()=>{if(!image.naturalWidth){finish(new Error('empty'));return}if(image.decode)image.decode().then(()=>finish(),()=>finish());else finish()};image.onerror=()=>finish(new Error('image'));image.src=url})}
async function loadHeroImage(preview){if(!preview.isConnected||preview.dataset.loading||preview.dataset.ready)return;preview.dataset.loading='1';const frame=preview.closest('.art-frame'),status=frame.querySelector('.image-status'),retry=status.querySelector('button');retry.hidden=true;status.querySelector('span').textContent='正在加载清晰图…';frame.setAttribute('aria-busy','true');const path=preview.dataset.original;const urls=[asset(path),asset(path)+'?retry='+Date.now(),new URL('Images/Backup/'+path.split('/').pop(),asset('config.json')).href];for(const url of urls){if(!preview.isConnected)return;try{const image=await requestImage(url);if(!preview.isConnected)return;image.className=preview.className;image.alt=preview.alt;image.dataset.original=path;image.dataset.ready='1';preview.replaceWith(image);status.hidden=true;frame.setAttribute('aria-busy','false');return}catch{}}delete preview.dataset.loading;frame.setAttribute('aria-busy','false');status.querySelector('span').textContent='已显示预览图';retry.hidden=false;retry.onclick=()=>loadHeroImage(preview)}
window.addEventListener('online',()=>app.querySelectorAll('img[data-original]:not([data-ready])').forEach(loadHeroImage));

function result(){const output=matchWZTI(config,answers);if(output.status!=='matched'){current=config.questions.findIndex(q=>q.id===output.missing[0]);question();return}screen='result';const r=output.result,p=r['最佳匹配英雄'];show(`<article class="result">${heroImage(r,"hero")}<div class="eyebrow">你的英雄人格</div><h1>${esc(r['英雄名称'])}</h1><div class="persona">${esc(r['人格标题'])}</div><blockquote>“${esc(r['英雄台词'])}”</blockquote><section class="panel"><h2 class="section-title">你的性格底色</h2><p>${esc(r['性格描述'])}</p></section><section class="panel"><h2 class="section-title">你的性格八维</h2><div class="chart" role="img" aria-label="${esc(Object.entries(r['性格维度百分比']).map(([k,v])=>k+v+'%').join('，'))}">${Object.entries(r['性格维度百分比']).map(([k,v])=>`<div class="column"><b>${v}%</b><div class="track"><div class="fill" style="height:${v}%"></div></div><small>${esc(k)}</small></div>`).join('')}</div><p class="chart-note">根据本次选择生成的八项性格倾向，各项独立计算。</p></section><section class="panel partner"><h2 class="section-title">最佳匹配英雄</h2>${heroImage(p,"partner")}<h3>${esc(p['英雄名称'])}</h3><p class="subtitle">${esc(p['匹配标题'])}</p><p>${esc(p['匹配理由'])}</p></section><div class="result-actions"><button class="primary" id="restart">再测一次</button></div></article>`);app.querySelectorAll('img[data-original]').forEach(loadHeroImage);document.querySelector('#restart').onclick=()=>{answers={};current=0;home()}}
document.querySelector('#brand').onclick=e=>{e.preventDefault();home()};
async function boot(){
  document.querySelector('#brand img').src=config.brand.logoDataURI;
  await Promise.all([config.brand.iconDataURI,config.brand.logoDataURI].map(src=>new Promise(resolve=>{const image=new Image();image.onload=()=>{if(image.decode)image.decode().then(resolve,resolve);else resolve()};image.onerror=resolve;image.src=src})));
  home();document.body.style.visibility='visible';
}
boot();
</script></body></html>
