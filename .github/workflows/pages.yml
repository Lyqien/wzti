name: Publish WZTI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check analytics.js
          node --check app.js
          node --check match.js
      - name: Cache lightweight images
        uses: actions/cache@v4
        with:
          path: |
            Images/Outputs_Images/*.webp
            Images/Backup/*.png
            Images/Outputs_Images/webp-recipe.txt
          key: webp-v2-${{ hashFiles('Images/Outputs_Images/*.png', 'scripts/prepare_images.py') }}
      - name: Install image encoder
        run: python -m pip install Pillow==11.3.0
      - name: Generate lightweight images
        run: python scripts/prepare_images.py
      - name: Build self-contained page
        run: python scripts/build_page.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir _site
          cp index.html style.css app.js match.js config.json icon-32.png share-cover.jpg _site/
          mkdir -p _site/Images/Outputs_Images
          cp Images/Outputs_Images/*.webp _site/Images/Outputs_Images/
          cp -R Images/Backup _site/Images/
          touch _site/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
